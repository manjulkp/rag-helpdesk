[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helpdesk-rag"
version = "0.1.0"
description = "A local hybrid-search helpdesk RAG application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0,<5",
    "transformers>=4.41,<5",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "faiss-cpu>=1.8"]  # faiss: the step 13 index lab only

[tool.setuptools.packages.find]
include = ["helpdesk*", "helpdesk_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
